version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: datdon_db
    restart: always
    env_file:
      - .env
    volumes:
      - datdon_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - datdon_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datdon_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_ENV=production
    depends_on:
      - db
    networks:
      - datdon_net
    command: >
      sh -c "npx prisma db push --skip-generate --accept-data-loss && node server.js"

volumes:
  datdon_db_data:

networks:
  datdon_net:
    driver: bridge
